services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: uco-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: uco_realty_pwd
      APP_USER: uco_realty
      APP_USER_PASSWORD: uco_realty_pwd
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "sqlplus -L uco_realty/uco_realty_pwd@localhost:1521/XEPDB1 <<< 'select 1 from dual;'"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  oracle-data:
