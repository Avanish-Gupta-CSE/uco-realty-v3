# Spring profile "h2" = laptop only, NO Oracle needed. scripts/dev-start.sh (without --oracle) switches it on by itself (SPRING_PROFILES_ACTIVE=h2);
# it is never switched on in UAT or production (the application.properties files do not set a profile).
# H2 runs in memory inside the application and both apps share it (see config/H2ServerStarter). Data is gone when the application stops.
# Web console: http://localhost:8082 (JDBC URL as below, user sa, empty password).
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:ucorealty;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# At every start, run all our SQL: the tables (db_migrations/01), the HRMS stand-in tables (03) and the test employees (05)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2-init.sql
