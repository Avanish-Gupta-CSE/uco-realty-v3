# UcoRealtyStaff: Single application.properties (aligned with bank IndiaPost UAT pattern).
# Connects directly to bank UAT Oracle (CLDBUAT) as HRMS_DBA by default.
# On a Windows VM with no environment variables, it runs out-of-the-box.
# Local runs or container overrides can be passed via DB_URL, DB_USER, DB_PASS, etc.

server.port=${SERVER_PORT:8081}
server.servlet.context-path=/UcoRealtyStaff
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.application.name=UcoRealtyStaff

# TODO: if the DB host/port/service name or user differs from the line below, change it here (spring.datasource.url / username).
# Database Connection (Connects directly as HRMS_DBA to bank UAT Oracle CLDBUAT)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//10.21.128.29:1530/CLDBUAT}
spring.datasource.username=${DB_USER:HRMS_DBA}
# TODO: put the real DB password (HRMS_DBA on CLDBUAT) in place of CHANGE_ME_DB_PASSWORD before building the WAR. NEVER commit it.
spring.datasource.password=${DB_PASS:CHANGE_ME_DB_PASSWORD}
spring.datasource.hikari.pool-name=UcoRealtyStaffPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
# TODO: Oracle 19c or newer (the bank's UAT/production). Hibernate 7 does not support Oracle 12c. Keep this line; the laptop H2 profile overrides it.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# View & Multipart
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=35MB

# Logging
logging.level.com.ucorealty=INFO
logging.level.org.springframework.web=INFO

# TODO: replace the default key with the real bank SSO key (16, 24 or 32 characters) given by the bank. NEVER commit it.
# TODO: ask the bank to register http://<server>:<port>/UcoRealtyStaff/entry in their SSO portal.
# Bank SSO key (UAT development key default)
sso.encryption.key=${SSO_ENCRYPTION_KEY:UCOBANKSSOKEY2026!SECRET#128BITS}
# TODO: confirm with the bank how their SSO portal encrypts the token. Allowed values, exactly: AES/GCM/NoPadding (12-byte IV first; default, has an integrity check) or AES/CBC/PKCS5Padding (16-byte IV first; use only if the bank requires it). Any other text stops the application at start.
sso.cipher=${SSO_CIPHER:AES/GCM/NoPadding}

# TODO (BEFORE PRODUCTION): set uco.sso.dev-login-enabled=false and DELETE the uco.sso.test-otp line. Production must use bank SSO only.
# UAT test login: employee number + fixed test OTP
uco.sso.dev-login-enabled=${DEV_LOGIN_ENABLED:true}
uco.sso.test-otp=${TEST_OTP:123456}


# TODO (BEFORE PRODUCTION): 7103 is there only because real UAT DIT staff sit at 7103 (nobody at 7115). Remove 7103, keep 7115 (real DIT SOL).
# Role mapping by SOL
uco.rbac.superadmin-sols=7115,7103
uco.rbac.marketing-sols=8028
uco.rbac.retail-sols=8001
uco.rbac.zonal-sol-regex=70(0[1-9]|[1-9]\\d)

# The line below is commented out on purpose: the application uses the Oracle settings above (UAT and production).
# Only for a laptop with no database: remove the leading # to run on in-memory H2 (tables + test employees created at start).
# Never remove the # in a build that goes to UAT or production. (scripts/dev-start.sh switches H2 on by itself, no edit needed.)
# spring.profiles.active=h2
