# OpenAPI 3 description of the JSON addresses of the STAFF app (UcoRealtyStaff). Needs a signed-in employee (browser session
# from the bank SSO); there is no API key. Written by hand: when you add or change an address in controller/PlacesApiController.java,
# change this file too (python3 scripts/sync_check.py tells you if an address is missing).
# The screens of the site (HTML pages and forms) are not described here. There is no leads API on purpose: customer data is only
# on the Leads page and in its Excel file, behind POST buttons with the security token (secure coding order, points 4 and 5).
openapi: 3.0.3
info:
  title: UCO Realty - staff API
  version: "1.0"
  description: >
    Read only. Without a session every address answers 302 (redirect to /not-signed-in, or /session-expired when the session timed out). With a session but a role that is not
    allowed it answers 403. Roles are in util/StaffRoles.java.
servers:
  - url: http://localhost:8081/UcoRealtyStaff
    description: Laptop (scripts/dev-start.sh). On Tomcat the first part of the address is the WAR name, /UcoRealtyStaff.
security:
  - bankSessionCookie: []
paths:
  /api/admin/geo:
    get:
      summary: Zones, states and districts for the project form
      description: Any staff role (DIT, HO Marketing, HO Retail, zonal maker or checker).
      responses:
        "200":
          description: The reference lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones: { type: array, items: { type: string } }
                  states: { type: array, items: { type: string } }
                  stateDistricts:
                    type: object
                    description: For each state, its districts
                    additionalProperties: { type: array, items: { type: string } }
        "302": { description: Not signed in }
        "403": { description: Signed in, but the role is not a staff role }
components:
  securitySchemes:
    bankSessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Created when the employee signs in through the bank SSO (or the test login on a laptop).
