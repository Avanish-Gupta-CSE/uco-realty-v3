# UcoRealty: Single application.properties (aligned with bank IndiaPost UAT pattern).
# Connects directly to bank UAT Oracle (CLDBUAT) as HRMS_DBA by default.
# On a Windows VM with no environment variables, it runs out-of-the-box.
# Local runs or container overrides can be passed via DB_URL, DB_USER, DB_PASS, etc.

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/UcoRealty
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.application.name=UcoRealty

# TODO: if the DB host/port/service name or user differs from the line below, change it here (spring.datasource.url / username).
# Database Connection (Connects directly as HRMS_DBA to bank UAT Oracle CLDBUAT)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//10.21.128.29:1530/CLDBUAT}
spring.datasource.username=${DB_USER:HRMS_DBA}
# TODO: put the real DB password (HRMS_DBA on CLDBUAT) in place of CHANGE_ME_DB_PASSWORD before building the WAR. NEVER commit it.
spring.datasource.password=${DB_PASS:CHANGE_ME_DB_PASSWORD}
spring.datasource.hikari.pool-name=UcoRealtyCustomerPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# View & Multipart
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=35MB

# Bank Home Loan application site. "Apply for Home Loan" on a project page opens  <this value> + /Lead_App/lead_web.jsp?utm=REALTY
# TODO: change the address below to the Production host when building the Production WAR (UAT and Production differ). Leave out the trailing slash.
uco.homeloan.base-url=${HOME_LOAN_BASE_URL:https://customerservice.ucoonline.bank.in}

# Logging
logging.level.com.ucorealty=INFO
logging.level.org.springframework.web=INFO

# TODO: delete the next line (spring.profiles.active=h2) when the real Oracle UAT DB is used, then rebuild. Never ship it to production.
# UAT without database access: run on in-memory H2 (tables + test employees created at start). Delete this line to use Oracle.
spring.profiles.active=h2
