# ucorealty-staff: settings shared by every profile.
#
# WHICH SETUP RUNS IS DECIDED BY THE NEXT LINE. Change it and rebuild (an environment variable SPRING_PROFILES_ACTIVE also overrides it):
#   h2    no database connection: tables and test employees are created in H2 memory at every start (laptop, or UAT without a DB)
#   uat   a real Oracle schema: set DB_URL, DB_USER, DB_PASS; same test employees and OTP; run db_migrations 01, 03, 05 first
#   prod  production: bank SSO + bank HRMS only
spring.profiles.active=h2

server.servlet.context-path=/ucorealty-staff
server.port=${SERVER_PORT:8081}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.application.name=ucorealty-staff

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.pool-name=UcoRealtyStaffPool
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=35MB

logging.level.com.ucorealty=INFO

# Bank SSO secrets. No defaults: startup fails if SSO_ENCRYPTION_KEY is not provided (UAT/prod).
sso.encryption.key=${SSO_ENCRYPTION_KEY}
sso.encryption.iv=${SSO_ENCRYPTION_IV:}

app.redirect.url=${APP_REDIRECT_URL:/admin/projects}

# Employees are always read from the bank HRMS tables (employee_contact_details ...). Schema prefixes tried in order:
# empty = our own schema or a synonym, then hrms_dba.  Change only if the bank says the tables are elsewhere.
uco.hrms.table-prefixes=${HRMS_TABLE_PREFIXES:,hrms_dba.}
# employee-id + OTP page and plain /sso?emp_id=; only the h2 and uat profiles turn this on
uco.sso.dev-login-enabled=false

# Which posting (SOL) gets which role; see RoleResolver
# DIT: Logs page
uco.rbac.superadmin-sols=7115
# HO Marketing and Wealth Management: create/approve in any zone (env UCO_RBAC_MARKETING_SOLS)
uco.rbac.marketing-sols=8028
# HO Retail Banking: customer leads + Excel only (env UCO_RBAC_RETAIL_SOLS)
uco.rbac.retail-sols=8001
# Zonal offices, e.g. 7001 = Patna Zonal Office
uco.rbac.zonal-sol-regex=70(0[1-9]|[1-4]\\d)
