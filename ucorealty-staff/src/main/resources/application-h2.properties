# h2: no database connection needed. H2 runs in memory inside the application (see config/H2ServerStarter) and both apps share it.
# Data is gone when the application stops. Web console: http://localhost:8082 (JDBC URL as below, user sa, empty password).
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:ucorealty;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# At every start, run all our SQL: the tables (db_migrations/01), the HRMS stand-in tables (03) and the test employees (05)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2-init.sql

# Test login (employee number + OTP): employees 100001 to 600002 from the HRMS tables, created from db_migrations/03 and 05
uco.sso.dev-login-enabled=true
uco.sso.test-otp=123456
# Development SSO key, until the bank gives the real one
sso.encryption.key=${SSO_ENCRYPTION_KEY:VUNPQkFOS1NTT0tFWTIwMjYhU0VDUkVUIzEyOEJJVFM=}
sso.encryption.iv=${SSO_ENCRYPTION_IV:MDEyMzQ1Njc4OWFiY2RlZg==}
