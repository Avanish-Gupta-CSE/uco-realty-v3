# Laptop only, never deploy with this profile (SPRING_PROFILES_ACTIVE=local, set by scripts/dev-start.sh).
# Database: by default the in-memory H2 started by `scripts/dev-start.sh --h2`. `scripts/dev-start.sh` (no flag) sets DB_URL, DB_USER
# and DB_PASS to the Oracle container instead. Staff are the test employees in the HRMS tables created from db_migrations/03 and 05 (OTP 123456 below), not real bank data.

# Same URL shape as UAT, where the WAR file name is the context path (ignored on Tomcat)
server.servlet.context-path=/ucorealty-staff
# Plain http on localhost
server.servlet.session.cookie.secure=false

spring.datasource.url=${DB_URL:jdbc:h2:tcp://localhost:9092/mem:ucorealty;MODE=Oracle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=none

sso.encryption.key=${SSO_ENCRYPTION_KEY:VUNPQkFOS1NTT0tFWTIwMjYhU0VDUkVUIzEyOEJJVFM=}
sso.encryption.iv=${SSO_ENCRYPTION_IV:MDEyMzQ1Njc4OWFiY2RlZg==}

uco.sso.dev-login-enabled=true
# Any employee in the HRMS tables signs in with this OTP (the real OTP is the bank SSO portal's job). The prod profile refuses to start with it.
uco.sso.test-otp=123456
