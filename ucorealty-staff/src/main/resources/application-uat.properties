# UAT: same as production, but the tables are checked against the code at start and logging is more talkative.

# Refuse to start if the tables do not match the code
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

logging.level.root=INFO

# UAT demo (default): four fixed demo users (UAT001 DIT superadmin, UAT002 HO Marketing, UAT003 zonal maker, UAT004 zonal checker;
# employee number + password, all in class DemoUserDirectory). No HRMS tables and no bank SSO key are needed.
# When the bank HRMS and SSO are ready, switch to the real thing with environment variables, no rebuild:
#   UCO_AUTH_DIRECTORY=hrms   SSO_ENCRYPTION_KEY=...   (and SSO_ENCRYPTION_IV if the bank uses CBC)
uco.auth.directory=${UCO_AUTH_DIRECTORY:demo}
