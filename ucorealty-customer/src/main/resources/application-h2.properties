# Spring profile "h2" = NO Oracle needed. Switch it on with ONE Java option: -Dspring.profiles.active=h2
# (Tomcat on Windows: Tomcat service > Java > Java Options; or CATALINA_OPTS). Without that option the app uses the Oracle settings
# of application.properties. H2 runs in memory inside the application and both apps share it (see config/H2ServerStarter).
# Data is gone when Tomcat stops. Web console: http://localhost:8082 (JDBC URL as below, user sa, empty password).
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:ucorealty;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
# The staff app runs the SQL that creates the tables; this app only reads them.
