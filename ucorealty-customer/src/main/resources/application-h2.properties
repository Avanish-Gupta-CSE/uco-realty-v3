# Spring profile "h2": the UAT demo WITHOUT an Oracle connection. Use it together with uat:  SPRING_PROFILES_ACTIVE=uat,h2
# One H2 database in a FILE (survives restarts), shared by BOTH WARs through H2's automatic server mode, so the customer site
# shows what the staff site approves. Needs the WAR built with the H2 driver (scripts/package-release.sh uat does that).
# Folder: UCO_H2_DIR (default: ucorealty-h2 in the home folder of the user running Tomcat). No user/password to set.
spring.datasource.url=jdbc:h2:file:${UCO_H2_DIR:${user.home}/ucorealty-h2}/ucorealty;AUTO_SERVER=TRUE;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
# the customer app only reads; the staff app creates the tables
