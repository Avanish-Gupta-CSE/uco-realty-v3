# Laptop only (SPRING_PROFILES_ACTIVE=local, set by scripts/dev-start.sh). Database: by default the in-memory H2 started by
# `scripts/dev-start.sh --h2` (shared with the staff app); `scripts/dev-start.sh` (no flag) sets DB_URL, DB_USER and DB_PASS to the Oracle container.

# Same URL shape as UAT, where the WAR file name is the context path (ignored on Tomcat)
server.servlet.context-path=/ucorealty-customer
# Plain http on localhost
server.servlet.session.cookie.secure=false

spring.datasource.url=${DB_URL:jdbc:h2:tcp://localhost:9092/mem:ucorealty;MODE=Oracle;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=none
