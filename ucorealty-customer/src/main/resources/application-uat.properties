# uat: a real Oracle schema. Before the first start the DBA runs db_migrations 01_CREATE_TABLES, 03_CREATE_HRMS_MOCK_TABLES, 05_LOCAL_TEST_EMPLOYEES in it.
# Connection: set DB_URL, DB_USER, DB_PASS as environment variables (Tomcat bin/setenv.sh).

# Refuse to start if the tables do not match the code
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

logging.level.root=INFO
