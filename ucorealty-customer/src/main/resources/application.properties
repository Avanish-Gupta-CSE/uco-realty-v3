# ucorealty-customer (the internet-facing, read-only catalog): settings shared by every environment. The active profile
# (SPRING_PROFILES_ACTIVE, default prod) adds one more file:  application-local.properties, application-uat.properties, application-prod.properties
# Database settings have the same names everywhere: DB_URL, DB_USER, DB_PASS (JVM -D... or OS environment).

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.application.name=ucorealty-customer
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.pool-name=UcoRealtyCustomerPool
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=35MB

logging.level.com.ucorealty=INFO
