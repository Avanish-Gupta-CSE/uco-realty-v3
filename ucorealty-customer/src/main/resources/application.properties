# ucorealty-customer (the internet-facing, read-only catalog): settings shared by every profile.
#
# WHICH SETUP RUNS IS DECIDED BY THE NEXT LINE. Change it and rebuild (an environment variable SPRING_PROFILES_ACTIVE also overrides it):
#   h2    no database connection: tables and test employees are created in H2 memory at every start (laptop, or UAT without a DB)
#   uat   a real Oracle schema: set DB_URL, DB_USER, DB_PASS; same test employees and OTP; run db_migrations 01, 03, 05 first
#   prod  production: bank SSO + bank HRMS only
spring.profiles.active=h2

server.servlet.context-path=/ucorealty-customer
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.application.name=ucorealty-customer

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.pool-name=UcoRealtyCustomerPool
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=35MB

logging.level.com.ucorealty=INFO
