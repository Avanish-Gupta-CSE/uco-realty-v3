# ucorealty-customer: Single application.properties (aligned with bank IndiaPost UAT pattern).
# Connects directly to bank UAT Oracle (CLDBUAT) as HRMS_DBA by default.
# On a Windows VM with no environment variables, it runs out-of-the-box.
# Local runs or container overrides can be passed via DB_URL, DB_USER, DB_PASS, etc.

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/ucorealty-customer
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.application.name=ucorealty-customer

# Database Connection (Connects directly as HRMS_DBA to bank UAT Oracle CLDBUAT)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//10.21.128.29:1530/CLDBUAT}
spring.datasource.username=${DB_USER:HRMS_DBA}
spring.datasource.password=${DB_PASS:CHANGE_ME_DB_PASSWORD}
spring.datasource.hikari.pool-name=UcoRealtyCustomerPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# View & Multipart
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=35MB

# Logging
logging.level.com.ucorealty=INFO
logging.level.org.springframework.web=INFO
