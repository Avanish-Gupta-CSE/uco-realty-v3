spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${ORACLE_USER:uco_realty}
    password: ${ORACLE_PASS:uco_realty_pwd}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ---- Local development only (never deploy with this profile) ----
server:
  servlet:
    session:
      cookie:
        secure: false

sso:
  encryption:
    key: "${SSO_ENCRYPTION_KEY:VUNPQkFOS1NTT0tFWTIwMjYhU0VDUkVUIzEyOEJJVFM=}"
    iv: "${SSO_ENCRYPTION_IV:MDEyMzQ1Njc4OWFiY2RlZg==}"

uco:
  hrms:
    mode: local
  sso:
    dev-login-enabled: true
  rbac:
    retail-sols: "8010"          # PLACEHOLDER for local testing only; the real Retail Banking SOL is not known yet
