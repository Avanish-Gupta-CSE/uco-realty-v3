server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

# Bank SSO secrets. No defaults: startup fails if SSO_ENCRYPTION_KEY is not provided (prod/UAT).
sso:
  encryption:
    key: "${SSO_ENCRYPTION_KEY}"
    iv: "${SSO_ENCRYPTION_IV:}"

app:
  redirect:
    url: "${APP_REDIRECT_URL:/admin/projects}"

uco:
  hrms:
    mode: ${HRMS_MODE:bank}      # bank = read employees from the HRMS tables; local = built-in test employees (dev profile only)
  sso:
    dev-login-enabled: false     # plain /sso?emp_id=, app-issued OTP and test-user picker; only the dev profile turns this on

spring:
  application:
    name: uco-realty-internal
  main:
    allow-circular-references: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 35MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
