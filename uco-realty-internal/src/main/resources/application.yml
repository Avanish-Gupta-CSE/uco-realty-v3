server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

# Bank SSO secrets. No defaults: startup fails if SSO_ENCRYPTION_KEY is not provided (prod/UAT).
sso:
  encryption:
    key: "${SSO_ENCRYPTION_KEY}"
    iv: "${SSO_ENCRYPTION_IV:}"

app:
  redirect:
    url: "${APP_REDIRECT_URL:/admin/projects}"

uco:
  hrms:
    mode: ${HRMS_MODE:bank}      # bank = read employees from the HRMS tables; local = built-in test employees (dev profile only)
  sso:
    dev-login-enabled: false     # plain /sso?emp_id=, app-issued OTP and test-user picker; only the dev profile turns this on
  rbac:                          # which posting (SOL) gets which role; see RoleResolver
    superadmin-sols: "7115"      # DIT: Logs page
    ho-admin-sols: "8028"        # DIT Projects and Product Development: view only
    marketing-sols: "8001"       # Marketing and Wealth Management: create/approve in any zone
    retail-sols: ""              # Retail Banking Department: leads + unit reduction. SET THE REAL SOL (env UCO_RBAC_RETAIL_SOLS)
    zonal-sol-regex: "70\\d\\d"     # zonal offices, e.g. 7001 = Patna Zonal Office

spring:
  application:
    name: uco-realty-internal
  main:
    allow-circular-references: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 35MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
