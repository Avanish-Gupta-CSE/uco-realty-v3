spring:
  config:
    activate:
      on-profile: uat

  datasource:
    url: ${UAT_ORACLE_URL}
    username: ${UAT_ORACLE_USER}
    password: ${UAT_ORACLE_PASS}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: UcoRealtyUATHikariPool
      minimum-idle: 3
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    in.co.ucobank.ucorealty: INFO
