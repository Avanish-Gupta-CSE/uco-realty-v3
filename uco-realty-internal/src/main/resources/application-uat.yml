spring:
  config:
    activate:
      on-profile: uat

  datasource:
    url: ${UAT_ORACLE_URL}
    username: ${UAT_ORACLE_USER}
    password: ${UAT_ORACLE_PASS}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: UcoRealtyUATHikariPool
      minimum-idle: 3
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.ucorealty: INFO

# UAT reads the bank's real HRMS tables (hrms_dba); no built-in test users. Set UCO_RBAC_RETAIL_SOLS to the Retail Banking SOL.
uco:
  hrms:
    mode: bank
  sso:
    dev-login-enabled: false
